<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Brasileiro</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./app.js" defer></script>
</head>
<body class="dark">
    <!-- Fundo fixo que ocupa 100% da viewport -->
    <div class="background">
        <div class="triangle-green"></div>
        <div class="triangle-yellow"></div>
        <div class="circle-blue"></div>
    </div>
    
    <main class="container">
        <div class="topbar">
            <h1>Cadastro Brasileiro <span class="flag-text">BR</span></h1>
            
            
            
            <label class="switch">
                <input type="checkbox" id="themeToggle">
                <span class="slider">
                    <span class="icon moon">🌙</span>
                    <span class="icon sun">☀️</span>
                </span>
            </label>
        </div>
        <h5> Para inserir todos os dados de endereço de forma automática é recomendado inserir apenas o CEP. </h5>

        <div class="form-container">
            <div class="row">
                <div class="inputbox">
                    <input type="text" id="nome" placeholder=" ">
                    <label>Nome</label>
                </div>
                
                <div class="inputbox email-box">
                    <div class="email-input-wrapper">
                        <input type="text" id="emailUser" placeholder=" ">
                        <span class="email-domain" id="domainLabel">@gmail.com</span>
                    </div>
                    <label>Email</label>
                    <select id="emailProvider" class="select-provider">
                        <option value="@gmail.com">Gmail</option>
                        <option value="@hotmail.com">Hotmail</option>
                        <option value="@outlook.com">Outlook</option>
                        <option value="@yahoo.com">Yahoo</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="inputbox">
                    <input type="text" id="cep" maxlength="9" placeholder=" ">
                    <label>CEP</label>
                    <span class="error-msg" id="error-cep">CEP inválido</span>
                </div>
                <div class="inputbox">
                    <input type="text" id="endereco" placeholder=" ">
                    <label>Endereço</label>
                </div>
                <div class="inputbox numero-box">
                    <span class="numero-prefix">Nº</span>
                    <input type="text" id="numero" placeholder=" ">
                    <label class="label-numero">Número</label>
                    <span class="error-msg" id="error-numero">Insira um número válido</span>
                </div>
            </div>

            <div class="row">
                <div class="inputbox">
                    <input type="text" id="bairro" placeholder=" ">
                    <label>Bairro</label>
                </div>
                <div class="inputbox">
                    <select id="estado" class="select-uf">
                        <option value="">Selecione o Estado</option>
                    </select>
                    <label class="label-select">Estado</label>
                </div>
                <div class="inputbox">
                    <input type="text" id="cidade" list="listaCidades" placeholder=" " disabled>
                    <label id="labelCidade">Cidade (Selecione o Estado)</label>
                    <datalist id="listaCidades"></datalist>
                </div>
            </div>

            <div class="buttons">
                <button id="btnSalvar">Salvar</button>
                <button id="btnAtualizar" hidden>Atualizar</button>
            </div>
        </div>

        <section class="usuarios">
            <h2>Usuários Salvos</h2>
            <div id="listaUsuarios"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Cadastro Brasileiro BR - Todos os direitos reservados.</p>
    </footer>
</body>
</html>
